name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          pod --version || brew install cocoapods

      - name: Generate project
        run: xcodegen generate

      - name: Install pods
        run: pod install --repo-update

      - name: Unit tests
        run: >
          xcodebuild test
          -workspace MangaReader.xcworkspace
          -scheme MangaReader
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)'
          -derivedDataPath DerivedData
          SWIFT_STRICT_CONCURRENCY=minimal

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -workspace MangaReader.xcworkspace \
            -scheme MangaReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build
          mkdir -p Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/MangaReader.app" Payload/
          zip -qry MangaReader-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-unsigned-ipa
          path: MangaReader-unsigned.ipa

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MangaReader-unsigned.ipa
